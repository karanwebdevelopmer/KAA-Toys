<!-- Firebase Integration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBftHnG49-KBBlq5NlMomKnCmH9kuE75O8",
            authDomain: "sr-toys-53640.firebaseapp.com",
            databaseURL: "https://sr-toys-53640-default-rtdb.firebaseio.com",
            projectId: "sr-toys-53640",
            storageBucket: "sr-toys-53640.firebasestorage.app",
            messagingSenderId: "33173355522",
            appId: "1:33173355522:web:6cdf03b54f91a58439fb1b",
            measurementId: "G-V8XH0HVNVQ"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Cache products in localStorage for faster loading
        const CACHE_KEY = 'sr_toys_products_cache';
        const CACHE_TIME_KEY = 'sr_toys_products_cache_time';
        const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes

        // Load products from Firebase
        function loadProducts() {
            const productsGrid = document.getElementById('productsGrid');
            
            // Check cache first
            const cachedData = localStorage.getItem(CACHE_KEY);
            const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
            const now = Date.now();
            
            if (cachedData && cacheTime && (now - parseInt(cacheTime)) < CACHE_DURATION) {
                // Use cached data for instant loading
                displayProducts(JSON.parse(cachedData));
            }
            
            // Fetch fresh data from Firebase
            onValue(ref(database, 'products'), (snapshot) => {
                const products = snapshot.val();
                
                // Cache the data
                if (products) {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(products));
                    localStorage.setItem(CACHE_TIME_KEY, now.toString());
                }
                
                displayProducts(products);
            }, { onlyOnce: false }); // Listen for real-time updates
        }

        function displayProducts(products) {
            const productsGrid = document.getElementById('productsGrid');
            
            if (products) {
                let html = '';
                Object.entries(products).forEach(([id, product]) => {
                    const isOutOfStock = product.stock === 'Out of Stock';
                    const stockClass = isOutOfStock ? 'out-of-stock' : '';
                    
                    // Use image if available, otherwise use icon
                    const productDisplay = product.image ? 
                        `<div class="product-image-container"><img src="${product.image}" alt="${product.name}" class="product-img" loading="lazy"></div>` :
                        `<div class="product-image"><i class="${product.icon}"></i></div>`;
                    
                    html += `
                        <div class="product-card ${stockClass}">
                            ${productDisplay}
                            ${isOutOfStock ? '<div class="stock-badge">Out of Stock</div>' : ''}
                            <h3>${product.name}</h3>
                            <p class="product-description">${product.description}</p>
                            <p class="price">₹${product.price}</p>
                            ${isOutOfStock ? 
                                '<button class="buy-btn disabled" disabled>Out of Stock</button>' : 
                                '<a href="order.html" class="buy-btn">Buy Now</a>'}
                        </div>
                    `;
                });
                productsGrid.innerHTML = html;
            } else {
                productsGrid.innerHTML = '<div class="no-products"><p>No products available at the moment.</p></div>';
            }
        }

        loadProducts();
    </script>
